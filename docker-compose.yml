services:
    clickhouse:
        image: clickhouse/clickhouse-server:latest
        container_name: analytics-clickhouse
        hostname: clickhouse-server
        restart: unless-stopped
        ports:
            - "9001:8123"
            - "9000:9000"
        volumes:
            - clickhouse_data:/var/lib/clickhouse
            - clickhouse_logs:/var/log/clickhouse-server
            - ./clickhouse/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
            - ./clickhouse/users.xml:/etc/clickhouse-server/users.xml
            - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
            - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
        environment:
            CLICKHOUSE_USER: ${CLICKHOUSE_USER}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        healthcheck:
            test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - analytics_network

    server:
        build:
            context: ./server
            dockerfile: Dockerfile
        container_name: analytics-server
        restart: unless-stopped
        ports:
            - "9002:8080"
        environment:
            CLICKHOUSE_ADDR: clickhouse-server:9000
            CLICKHOUSE_DB: events
            CLICKHOUSE_USER: ${CLICKHOUSE_USER}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
            API_TOKEN: ${API_TOKEN}
        depends_on:
            clickhouse:
                condition: service_healthy
        networks:
            - analytics_network

    grafana:
        image: grafana/grafana:latest
        container_name: analytics-grafana
        restart: unless-stopped
        ports:
            - "9003:3000"
        volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
            - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
            - ./grafana/grafana.ini:/etc/grafana/grafana.ini
        environment:
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
            GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ACCESS_ENABLED}
            GF_AUTH_ANONYMOUS_ORG_NAME: ${GRAFANA_ANONYMOUS_ORG_NAME}
            GF_AUTH_ANONYMOUS_ORG_ROLE: ${GRAFANA_ANONYMOUS_ORG_ROLE}
            GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
        depends_on:
            clickhouse:
                condition: service_healthy
        networks:
            - analytics_network

volumes:
    clickhouse_data:
    clickhouse_logs:
    grafana_data:

networks:
    analytics_network:
        driver: bridge
