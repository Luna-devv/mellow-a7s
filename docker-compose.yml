services:
    clickhouse:
        image: clickhouse/clickhouse-server:latest
        container_name: analytics-clickhouse
        hostname: clickhouse-server
        ports:
            - "9001:8123"
            - "9000:9000"
        volumes:
            - clickhouse_data:/var/lib/clickhouse
            - clickhouse_logs:/var/log/clickhouse-server
            - ./clickhouse/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
        environment:
            CLICKHOUSE_USER: ${CLICKHOUSE_USER}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
        ulimits:
            nofile:
                soft: 262144
                hard: 262144
        healthcheck:
            test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
        - analytics_network

    server:
        build:
            context: ./server
            dockerfile: Dockerfile
        container_name: analytics-server
        ports:
        - "9002:8080"
        environment:
            CLICKHOUSE_ADDR: clickhouse-server:9000
            CLICKHOUSE_DB: events
            CLICKHOUSE_USER: ${CLICKHOUSE_USER}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
            API_TOKEN: ${API_TOKEN}
        depends_on:
            clickhouse:
                condition: service_healthy
        networks:
        - analytics_network
